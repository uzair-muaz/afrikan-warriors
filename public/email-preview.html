<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Afrikan Warriors · Email preview</title>
  <style>
    :root {
      --stage: #050505;
      --gold: #f2ca50;
      --muted: #d0c5af;
      --rule: rgba(212, 175, 55, 0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--stage);
      color: #e2e2e2;
      font-family: "Hanken Grotesk", system-ui, sans-serif;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    h1 {
      margin: 0 0 8px;
      font-family: Anybody, Arial Black, sans-serif;
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .lead {
      margin: 0 0 36px;
      color: var(--muted);
      max-width: 42rem;
      line-height: 1.6;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tabs button {
      appearance: none;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--muted);
      padding: 12px 16px;
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .tabs button[aria-selected="true"] {
      background: var(--gold);
      color: #3c2f00;
      border-color: var(--gold);
    }
    .frame {
      border: 1px solid var(--rule);
      background: #121414;
      overflow: hidden;
    }
    .frame iframe {
      display: block;
      width: 100%;
      min-height: 860px;
      border: 0;
      background: #0b0b0b;
    }
    .note {
      margin-top: 18px;
      color: #99907c;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Email template preview</h1>
    <p class="lead">
      Live preview of the branded Afrikan Warriors emails. Switch tabs to compare
      the team payment notice, supporter thank-you, and booking enquiry.
    </p>

    <div class="tabs" role="tablist" aria-label="Email samples">
      <button type="button" role="tab" aria-selected="true" data-src="/email-preview-support-team.html">
        Team · Support payment
      </button>
      <button type="button" role="tab" aria-selected="false" data-src="/email-preview-support-customer.html">
        Supporter · Thank you
      </button>
      <button type="button" role="tab" aria-selected="false" data-src="/email-preview-enquiry.html">
        Team · Booking enquiry
      </button>
    </div>

    <div class="frame">
      <iframe id="preview" title="Email preview" src="/email-preview-support-team.html"></iframe>
    </div>
    <p class="note">Also open each file directly: /email-preview-support-team.html</p>
  </div>

  <script>
    const frame = document.getElementById("preview");
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.setAttribute("aria-selected", "false"));
        tab.setAttribute("aria-selected", "true");
        frame.src = tab.dataset.src;
      });
    });
  </script>
</body>
</html>
